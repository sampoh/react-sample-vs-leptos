name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 同じブランチで連続 push したときは古いデプロイを取り消す
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: 依存パッケージのインストール
        run: npm ci

      - name: lint (oxlint)
        run: npm run lint -- --deny-warnings

      - name: ビルド (型チェック込み)
        run: npm run build

      # コミットタイトルをデプロイメッセージとして渡す (ダッシュボードの「Manually deployed」の代わりに表示される)
      # メッセージは引用符などを含み得るため、wrangler-action の command へ埋め込まず環境変数経由で渡す
      - name: Cloudflare Workers へデプロイ
        if: github.event_name != 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_VERSION: "4.157.0"
          LC_ALL: C.UTF-8
        run: |
          msg="$(git log -1 --format=%s)"
          # --message は最大100文字 (UTF-8 ロケールなので日本語も文字単位で切り詰められる)
          msg="${msg:0:100}"
          npx --yes "wrangler@${WRANGLER_VERSION}" deploy \
            --message "$msg" \
            --tag "${GITHUB_SHA::7}"
